# Serves the built Wasp client: real files as-is, a prerendered route's index.html when
# the app uses Wasp's `prerender` option, and every other path falls back to 200.html, the
# single-page shell Wasp's Vite build emits, so client-side routes like /login work on a direct visit.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html 200.html;

    # Hashed Vite assets never change: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html /200.html;
    }
}
