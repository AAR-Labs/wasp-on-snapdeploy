# Serves the built Wasp client (a single-page app): real files as-is, every other path
# falls back to 200.html, the entry page Wasp's Vite build emits (there is no index.html),
# so client-side routes like /login work on a direct visit.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        200.html;

    # Hashed Vite assets never change: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /200.html;
    }
}
